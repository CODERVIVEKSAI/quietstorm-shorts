name: Sports Video

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Which sport to recap"
        required: true
        default: "cricket"
        type: choice
        options: [cricket, football]

permissions:
  contents: write   # to commit generation_log.jsonl

jobs:
  # Phase 1 — generate the script only, upload for review.
  script:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.runid.outputs.run_id }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INPUT_SPORT: ${{ github.event.inputs.sport }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - id: runid
        run: echo "run_id=sports-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Generate script
        run: python -m generators.${INPUT_SPORT} --run-id "${{ steps.runid.outputs.run_id }}" --stage script
      - name: Render script summary for reviewer
        run: python scripts/script_summary.py "output/${{ steps.runid.outputs.run_id }}/${INPUT_SPORT}"
      - uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.event.inputs.sport }}-${{ steps.runid.outputs.run_id }}
          path: output/${{ steps.runid.outputs.run_id }}/${{ github.event.inputs.sport }}/
          retention-days: 7

  # Auto-approve any still-pending deployment after 30 min of no reviewer
  # action. Requires AUTO_APPROVE_PAT secret (see auto_approve_after_wait.sh).
  auto-approve:
    needs: script
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_APPROVE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait 30 min then auto-approve if reviewer hasn't acted
        run: bash scripts/auto_approve_after_wait.sh

  # Phase 2 — TTS + visuals + assemble, gated on manual approval (with
  # 30-min auto-approve fallback above).
  video:
    needs: script
    runs-on: ubuntu-latest
    environment: manual-approval
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      INPUT_SPORT: ${{ github.event.inputs.sport }}
      RUN_ID: ${{ needs.script.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Download approved script
        uses: actions/download-artifact@v4
        with:
          name: script-${{ github.event.inputs.sport }}-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/${{ github.event.inputs.sport }}/
      - name: Build video from approved script
        run: python -m generators.${INPUT_SPORT} --run-id "$RUN_ID" --stage video
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.sport }}-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/${{ github.event.inputs.sport }}/
          retention-days: 7
      - name: Commit generation_log addition
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add data/generation_log.jsonl
            if git diff --cached --quiet 2>/dev/null; then
              echo "no log change"; break
            fi
            git commit -m "log: record ${{ github.event.inputs.sport }} sports video"
            if git push; then break; fi
            echo "push conflict, retrying..."
            sleep $((RANDOM % 4 + 1))
          done

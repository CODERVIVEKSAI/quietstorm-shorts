name: Edit Video

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Which format to regenerate"
        required: true
        type: choice
        options: [quote, what_if, joke, golden_lady, football, cricket, custom]
      edit_prompt:
        description: "How to change it (e.g. 'make it funnier', 'shorter', 'more Indian English')"
        required: true
        type: string
      source_artifact_run:
        description: "(Optional) Numeric run ID of the previous workflow run to load the previous script from."
        required: false
        type: string

permissions:
  contents: write   # to commit edit_log.jsonl back
  actions: read

jobs:
  # Phase 1 — regenerate the script only with the edit instruction.
  script:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.runid.outputs.run_id }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      INPUT_FORMAT: ${{ github.event.inputs.format }}
      INPUT_EDIT_PROMPT: ${{ github.event.inputs.edit_prompt }}
      INPUT_SOURCE_RUN: ${{ github.event.inputs.source_artifact_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt

      - id: runid
        run: echo "run_id=edit-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Download previous artifact (if provided)
        if: ${{ github.event.inputs.source_artifact_run != '' }}
        run: |
          mkdir -p prev
          # Try video-* first (approved+built source runs), then script-*
          # (source runs that were rejected at the approval gate so video was
          # never built — this is the edit-on-rejection path). Whichever exists
          # gives us script.json.
          gh run download "$INPUT_SOURCE_RUN" \
            --repo "${{ github.repository }}" \
            --dir prev \
            --pattern "video-${INPUT_FORMAT}-*" || echo "no video artifact"
          gh run download "$INPUT_SOURCE_RUN" \
            --repo "${{ github.repository }}" \
            --dir prev \
            --pattern "script-${INPUT_FORMAT}-*" || echo "no script artifact"
          PREV_SCRIPT=$(find prev -name script.json | head -n 1)
          if [ -n "$PREV_SCRIPT" ]; then
            cp "$PREV_SCRIPT" previous_script.json
            echo "Loaded previous script from $PREV_SCRIPT"
          else
            echo "No previous script.json found; will regenerate from scratch."
          fi

      - name: Regenerate script with edit instruction
        run: |
          ARGS=(--run-id "${{ steps.runid.outputs.run_id }}" --edit "$INPUT_EDIT_PROMPT" --stage script)
          if [ -f previous_script.json ]; then
            ARGS+=(--previous-script previous_script.json)
          fi
          if [ "$INPUT_FORMAT" = "custom" ]; then
            ARGS+=(--prompt "$INPUT_EDIT_PROMPT")
          fi
          python -m "generators.${INPUT_FORMAT}" "${ARGS[@]}"

      - name: Render script summary for reviewer
        run: python scripts/script_summary.py "output/${{ steps.runid.outputs.run_id }}/${INPUT_FORMAT}"

      - uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.event.inputs.format }}-${{ steps.runid.outputs.run_id }}
          path: output/${{ steps.runid.outputs.run_id }}/${{ github.event.inputs.format }}/
          retention-days: 7

  # Auto-approve any still-pending deployment after 30 min of no reviewer
  # action. Requires AUTO_APPROVE_PAT secret (see auto_approve_after_wait.sh).
  auto-approve:
    needs: script
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_APPROVE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait 30 min then auto-approve if reviewer hasn't acted
        run: bash scripts/auto_approve_after_wait.sh

  # Phase 2 — TTS + visuals + assemble, gated on manual approval (with
  # 30-min auto-approve fallback above).
  video:
    needs: script
    runs-on: ubuntu-latest
    environment: manual-approval
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      INPUT_FORMAT: ${{ github.event.inputs.format }}
      INPUT_EDIT_PROMPT: ${{ github.event.inputs.edit_prompt }}
      RUN_ID: ${{ needs.script.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # ubuntu-24.04 doesn't ship ffmpeg/ffprobe; install without apt-update.
      - run: sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt

      - name: Download approved script
        uses: actions/download-artifact@v4
        with:
          name: script-${{ github.event.inputs.format }}-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/${{ github.event.inputs.format }}/

      - name: Build video from approved script
        run: |
          ARGS=(--run-id "$RUN_ID" --stage video)
          if [ "$INPUT_FORMAT" = "custom" ]; then
            ARGS+=(--prompt "$INPUT_EDIT_PROMPT")
          fi
          python -m "generators.${INPUT_FORMAT}" "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.format }}-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/${{ github.event.inputs.format }}/
          retention-days: 7

      - name: Record edit pattern for future learning
        if: success()
        run: |
          python scripts/record_edit.py \
            --format "$INPUT_FORMAT" \
            --instruction "$INPUT_EDIT_PROMPT"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/edit_log.jsonl 2>/dev/null; then
            git add data/edit_log.jsonl
            git commit -m "log: record edit pattern ($INPUT_FORMAT)"
            git push
          fi

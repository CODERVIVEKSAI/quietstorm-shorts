name: Custom Video

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should the video be about? (free-form)"
        required: true
        type: string
      tone:
        description: "Tone"
        required: false
        default: "auto"
        type: choice
        options: [auto, serious, funny, hype, chill, educational]
      length:
        description: "Length"
        required: false
        default: "medium"
        type: choice
        options: [short, medium, max]
      visual_style:
        description: "Visual style"
        required: false
        default: "auto"
        type: choice
        options: [auto, people, no-people, nature, tech, abstract, animation]
      mood:
        description: "Mood"
        required: false
        default: "auto"
        type: choice
        options: [auto, uplifting, mysterious, energetic, calm, dark, nostalgic]
      voice:
        description: "Voice"
        required: false
        default: "auto"
        type: choice
        options: [auto, andrew, brian, christopher, prabhat, neerja]

permissions:
  contents: write   # to commit generation_log.jsonl

jobs:
  # Phase 1 — generate the script only, upload for review.
  script:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.runid.outputs.run_id }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      INPUT_PROMPT: ${{ github.event.inputs.prompt }}
      INPUT_TONE: ${{ github.event.inputs.tone }}
      INPUT_LENGTH: ${{ github.event.inputs.length }}
      INPUT_VISUAL: ${{ github.event.inputs.visual_style }}
      INPUT_MOOD: ${{ github.event.inputs.mood }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - id: runid
        run: echo "run_id=custom-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Generate script
        run: |
          python -m generators.custom \
            --run-id "${{ steps.runid.outputs.run_id }}" \
            --prompt "$INPUT_PROMPT" \
            --tone "$INPUT_TONE" \
            --length "$INPUT_LENGTH" \
            --visual-style "$INPUT_VISUAL" \
            --mood "$INPUT_MOOD" \
            --stage script
      - name: Render script summary for reviewer
        run: python scripts/script_summary.py "output/${{ steps.runid.outputs.run_id }}/custom"
      - uses: actions/upload-artifact@v4
        with:
          name: script-custom-${{ steps.runid.outputs.run_id }}
          path: output/${{ steps.runid.outputs.run_id }}/custom/
          retention-days: 7

  # Auto-approve any still-pending deployment after 30 min of no reviewer
  # action. Requires AUTO_APPROVE_PAT secret (see auto_approve_after_wait.sh).
  auto-approve:
    needs: script
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_APPROVE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait 30 min then auto-approve if reviewer hasn't acted
        run: bash scripts/auto_approve_after_wait.sh

  # Phase 2 — TTS + visuals + assemble, gated on manual approval (with
  # 30-min auto-approve fallback above).
  video:
    needs: script
    runs-on: ubuntu-latest
    environment: manual-approval
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      INPUT_VOICE: ${{ github.event.inputs.voice }}
      RUN_ID: ${{ needs.script.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # ubuntu-24.04 doesn't ship ffmpeg/ffprobe; install without apt-update
      # (the cached package index already has ffmpeg, and apt-update on these
      # runners has occasionally taken 20+ min on slow mirrors).
      - run: sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Download approved script
        uses: actions/download-artifact@v4
        with:
          name: script-custom-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/custom/
      - name: Build video from approved script
        run: |
          python -m generators.custom \
            --run-id "$RUN_ID" \
            --voice "$INPUT_VOICE" \
            --stage video
      - uses: actions/upload-artifact@v4
        with:
          name: video-custom-${{ env.RUN_ID }}
          path: output/${{ env.RUN_ID }}/custom/
          retention-days: 7

      - name: Commit generation_log addition
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git add data/generation_log.jsonl
            if git diff --cached --quiet 2>/dev/null; then
              echo "no log change"
              break
            fi
            git commit -m "log: record custom generation"
            if git push; then break; fi
            echo "push conflict, retrying..."
            sleep $((RANDOM % 4 + 1))
          done

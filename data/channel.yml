# Channel config. EDIT THIS FILE to rename the channel or change the voice.
# Every generator and the YouTube upload step reads from here.

handle: "@QuietStorm"
display_name: "QuietStorm"

# The guiding philosophy. Shows up in the bio, the pinned-post quote,
# and subtly shapes script tone.
tagline: "Work hard in silence. Let your success be your noise."

# Default voice used by every format unless a generator overrides it.
# Adam Multilingual is the newer Edge voice — most natural conversational male.
default_voice: "en-US-AdamMultilingualNeural"

# Short 9:16 video dimensions (YouTube Shorts requirement)
video:
  width: 1080
  height: 1920
  fps: 30
  max_duration_seconds: 60   # YouTube Shorts hard ceiling

# Per-format voice overrides — picked for character, not just clarity.
# The Multilingual neural voices have the most natural prosody.
voices:
  quote: "en-US-AndrewMultilingualNeural"   # warm reflective male, slight gravitas
  what_if: "en-US-BrianMultilingualNeural"  # young energetic male, viral-Shorts feel
  joke: "en-US-AdamMultilingualNeural"      # NEWER — super natural conversational, lands punchlines
  golden_lady: "en-IN-AaravNeural"          # NEWER Indian English male, warm
  cricket: "en-IN-AaravNeural"              # NEWER Indian English — fan-culture voice
  football: "en-US-AdamMultilingualNeural"  # commentator energy

# Per-format speech rate. Negative = slower, positive = faster. Format: "+0%", "-7%".
rates:
  quote: "-3%"          # contemplative
  what_if: "+0%"
  joke: "+2%"           # punchy timing
  golden_lady: "+0%"
  cricket: "+4%"        # hyped fan-Twitter energy
  football: "+3%"

# Per-format pitch offset, in Hz. Range roughly -50Hz to +50Hz; small moves are
# what you want. Negative = deeper voice (gravitas), positive = higher (energy).
# Empty / missing → "+0Hz" (no change).
pitches:
  quote: "-3Hz"         # slightly lower, reflective
  what_if: "+4Hz"       # higher, curious energy
  joke: "+0Hz"          # natural
  golden_lady: "-1Hz"   # warm, grounded
  cricket: "+3Hz"       # hyped
  football: "+4Hz"

# Per-format volume offset, "+0%" default. Bumps perceived loudness.
volumes: {}

# === Voice swap reference ===
# Shorts-style energetic:    en-US-EmmaMultilingualNeural, en-US-AvaMultilingualNeural,
#                            en-US-AndrewMultilingualNeural, en-US-BrianMultilingualNeural
# News/serious:              en-US-GuyNeural, en-US-AriaNeural
# TikTok-Jessie-ish (female):en-US-JennyNeural
# Indian English (male):     en-IN-AaravNeural (newer, natural), en-IN-PrabhatNeural, en-IN-RehaanNeural, en-IN-KunalNeural
# Indian English (female):   en-IN-AnanyaNeural (newer, natural), en-IN-NeerjaNeural, en-IN-KavyaNeural
# British:                   en-GB-RyanNeural, en-GB-SoniaNeural
# Browse all: python -c "import asyncio,edge_tts; print('\n'.join(v['ShortName'] for v in asyncio.run(edge_tts.list_voices()) if v['Locale'].startswith('en-')))"

# Hashtags appended to every upload description
base_hashtags:
  - "#shorts"
  - "#quietstorm"
  - "#daily"
